name: iOS tests

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run iOS tests
        run: xcodebuild -project BookReaderIOS.xcodeproj -scheme BookReaderIOS -destination 'platform=iOS Simulator,name=iPhone 16' test
